server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 184.192.182.39;

    ssl_certificate /etc/letsencrypt/live/184.192.182.39/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/184.192.182.39/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location = /api/wineries {
        include snippets/wineguard-java.conf;
    }

    location /api/wineries/ {
        include snippets/wineguard-java.conf;
    }

    location = /api/sensors {
        return 404;
    }

    location /api/sensors/ {
        return 404;
    }

    location /api/auth/ {
        include snippets/wineguard-java.conf;
    }

    location /api/admin/ {
        include snippets/wineguard-java.conf;
    }

    location = /api/devices {
        include snippets/wineguard-java.conf;
    }

    location /api/devices/ {
        include snippets/wineguard-java.conf;
    }

    location = /api/environments {
        include snippets/wineguard-java.conf;
    }

    location /api/environments/ {
        include snippets/wineguard-java.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
