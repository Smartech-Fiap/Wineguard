<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">WineGuard: fluxo da aplicação e como executar localmente</title>
  <desc id="desc">Diagrama do painel, backend Spring Boot, PostgreSQL, Orion, STH-Comet, sensores e passos para rodar localmente e conectar ao Beekeeper Studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2e"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#74d4b0"/><stop offset="1" stop-color="#a5e6b8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8db7c9"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf5f7}
      .title{font-size:35px;font-weight:750}.sub{font-size:16px;fill:#b4c7d4}.section{font-size:20px;font-weight:700;fill:#a9e9c7}
      .card{fill:#20364a;stroke:#426079;stroke-width:1.5}.card2{fill:#213d39;stroke:#57917a;stroke-width:1.5}
      .h{font-size:19px;font-weight:700}.p{font-size:14px;fill:#c5d4dc}.small{font-size:12px;fill:#a8bdc9}.edge{stroke:#8db7c9;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:7 6}.step{fill:#1d3347;stroke:#3e5d73;stroke-width:1}.num{fill:#71d5ad}
    </style>
  </defs>
  <rect width="1500" height="980" rx="26" fill="url(#bg)"/>
  <text x="58" y="68" class="title">WineGuard · fluxo e execução local</text>
  <text x="60" y="98" class="sub">Visão para integrar painel, backend Java, banco de configuração e infraestrutura FIWARE.</text>

  <text x="60" y="150" class="section">1 · Fluxo da aplicação</text>
  <rect x="55" y="174" width="1390" height="383" rx="20" fill="#14263a" stroke="#324a60"/>

  <rect x="90" y="246" width="220" height="104" rx="14" class="card"/>
  <text x="112" y="278" class="h">Painel web</text><text x="112" y="305" class="p">Chama a API por HTTP/JSON</text><text x="112" y="328" class="small">localhost:8080 · depois AWS</text>

  <rect x="405" y="230" width="285" height="140" rx="16" class="card2"/>
  <text x="430" y="263" class="h">Backend WineGuard</text><text x="430" y="290" class="p">Spring Boot · MVC · Java 17</text><text x="430" y="315" class="p">Controller → Service → Repository</text><text x="430" y="341" class="small">Valida cadastros e integra FIWARE</text>

  <rect x="790" y="200" width="245" height="100" rx="14" class="card"/>
  <text x="814" y="233" class="h">PostgreSQL</text><text x="814" y="258" class="p">Ambientes, dispositivos, limites</text><text x="814" y="280" class="small">Flyway cria e versiona tabelas</text>

  <rect x="790" y="340" width="245" height="86" rx="14" class="card"/>
  <text x="814" y="373" class="h">Orion Context Broker</text><text x="814" y="400" class="p">Estado atual · entidades NGSI</text>

  <rect x="1100" y="340" width="245" height="86" rx="14" class="card"/>
  <text x="1124" y="373" class="h">STH-Comet</text><text x="1124" y="400" class="p">Séries históricas de sensores</text>

  <rect x="1100" y="200" width="245" height="100" rx="14" class="card"/>
  <text x="1124" y="233" class="h">Dispositivos físicos</text><text x="1124" y="258" class="p">Publicam dados no ecossistema</text><text x="1124" y="280" class="small">Não precisam gravar direto no SQL</text>

  <path d="M310 298 H400" class="edge"/><text x="327" y="286" class="small">REST</text>
  <path d="M690 260 H784" class="edge"/><text x="712" y="247" class="small">JPA</text>
  <path d="M690 315 C735 315 735 383 784 383" class="edge"/><text x="704" y="359" class="small">leitura atual</text>
  <path d="M1035 383 H1094" class="edge"/><text x="1042" y="370" class="small">histórico*</text>
  <path d="M1100 249 C1065 249 1070 383 1041 383" class="edge dash"/><text x="1048" y="236" class="small">NGSI</text>

  <rect x="85" y="455" width="1260" height="70" rx="12" fill="#1b3042" stroke="#344f65"/>
  <text x="108" y="483" class="p">* A integração com STH consulta o histórico existente; o PostgreSQL da API não duplica leituras.</text>
  <text x="108" y="507" class="small">Em AWS, backend, PostgreSQL e VMs FIWARE precisam de rotas e regras de segurança entre si; confirme hostnames, portas e credenciais com a equipe.</text>

  <text x="60" y="610" class="section">2 · Como executar e visualizar</text>
  <rect x="55" y="634" width="1390" height="286" rx="20" fill="#14263a" stroke="#324a60"/>

  <rect x="85" y="672" width="290" height="180" rx="14" class="step"/>
  <circle cx="115" cy="704" r="18" class="num"/><text x="109" y="710" font-size="16" font-weight="800" fill="#102438">1</text>
  <text x="145" y="710" class="h">PostgreSQL local</text>
  <text x="108" y="747" class="p">Docker Desktop aberto</text><text x="108" y="775" class="p">docker compose up -d postgres</text><text x="108" y="812" class="small">porta 5432 · DB wineguard</text>

  <rect x="405" y="672" width="290" height="180" rx="14" class="step"/>
  <circle cx="435" cy="704" r="18" class="num"/><text x="429" y="710" font-size="16" font-weight="800" fill="#102438">2</text>
  <text x="465" y="710" class="h">IntelliJ IDEA</text>
  <text x="428" y="747" class="p">Importe o pom.xml como Maven</text><text x="428" y="775" class="p">Configure Project SDK: JDK 17</text><text x="428" y="812" class="small">Lombok + annotation processing</text>

  <rect x="725" y="672" width="290" height="180" rx="14" class="step"/>
  <circle cx="755" cy="704" r="18" class="num"/><text x="749" y="710" font-size="16" font-weight="800" fill="#102438">3</text>
  <text x="785" y="710" class="h">Rode a classe principal</text>
  <text x="748" y="747" class="p">Abra WineguardBackendApplication</text><text x="748" y="775" class="p">Triângulo verde ao lado de main</text><text x="748" y="812" class="small">Flyway aplica as migrações no início</text>

  <rect x="1045" y="672" width="350" height="180" rx="14" class="step"/>
  <circle cx="1075" cy="704" r="18" class="num"/><text x="1069" y="710" font-size="16" font-weight="800" fill="#102438">4</text>
  <text x="1105" y="710" class="h">Beekeeper Studio</text>
  <text x="1068" y="747" class="p">PostgreSQL · localhost:5432</text><text x="1068" y="775" class="p">Database e User: wineguard</text><text x="1068" y="812" class="small">Health: localhost:8080/actuator/health</text>

  <text x="85" y="887" class="small">Leituras exigem FIWARE alcançável: configure FIWARE_ORION_BASE_URL e FIWARE_STH_BASE_URL.</text>
  <text x="1150" y="952" class="small">VINHARIA AGNELLO · WINEGUARD</text>
</svg>
