services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wineguard
      POSTGRES_USER: wineguard
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-wineguard-local}
    ports:
      # Mantém a porta do PostgreSQL acessível apenas na máquina local.
      - "127.0.0.1:5432:5432"
    volumes:
      - wineguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wineguard -d wineguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wineguard-postgres-data:
