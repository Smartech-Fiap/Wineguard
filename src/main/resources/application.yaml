spring:
  application:
    name: wineguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wineguard}
    username: ${SPRING_DATASOURCE_USERNAME:wineguard}
    password: ${SPRING_DATASOURCE_PASSWORD:wineguard-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fiware:
  orion:
    base-url: ${FIWARE_ORION_BASE_URL:http://localhost:1026}
    service: ${FIWARE_SERVICE:vinheria}
    service-path: ${FIWARE_SERVICE_PATH:/}
  sth:
    base-url: ${FIWARE_STH_BASE_URL:http://localhost:8666}
