# Baseada na configuracao observada no broker WineGuard, Mosquitto 2.1.2.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

plugin_load wineguard_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# Somente rede Docker; o Compose nao publica esta porta no host.
listener 1883
listener_allow_anonymous true

# ESP32: senha, ACL e TLS.
listener 8883
listener_allow_anonymous false
plugin_use wineguard_acl
password_file /mosquitto/config/passwd
cafile /mosquitto/config/tls/ca.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
tls_version tlsv1.2
